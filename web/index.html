<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>悬壶 · 一间病房四位患者</title>
<style>
:root {
  color-scheme: light;
  --bg: #f3efe9;
  --card: #fffdf9;
  --subtle: #f8f4ef;
  --ink: #2d2527;
  --ink-2: #574b4c;
  --ink-3: #6f6061;
  --line: #ddd4cd;
  --accent: #8c3148;
  --accent-hover: #a44059;
  --accent-soft: #f5e6e8;
  --accent-on: #fff;
  --red: #a52f37;
  --red-soft: #ecc4c1;
  --danger-bg: #fbefed;
  --pink: #e9b9c0;
  --pink-deep: #8c3148;
  --green: #286a52;
  --green-bg: #e9f2eb;
  --amber: #8a5819;
  --amber-bg: #fcf1df;
  --anatomy-bg: #f8ece5;
  --anatomy-fill: #f4dfd5;
  --anatomy-line: #ddc2b7;
  --anatomy-axis: #d2ac9d;
  --shadow: 0 10px 28px rgb(66 37 38 / 8%);
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --pad: clamp(12px, 2.2vw, 34px);
  --dock-h: 69px;
  --work-width: 1320px;
}

body.night {
  color-scheme: dark;
  --bg: #151318;
  --card: #211d24;
  --subtle: #2a242c;
  --ink: #f7eaeb;
  --ink-2: #e1ccd1;
  --ink-3: #c5aeb6;
  --line: #493c46;
  --accent: #f2a6b7;
  --accent-hover: #ffc5d1;
  --accent-soft: #402b37;
  --accent-on: #331424;
  --red: #ff9b9e;
  --red-soft: #80424e;
  --danger-bg: #452831;
  --pink: #834d64;
  --pink-deep: #f2a6b7;
  --green: #9cd9be;
  --green-bg: #233a34;
  --amber: #f8c882;
  --amber-bg: #3e322b;
  --anatomy-bg: #2e222c;
  --anatomy-fill: #3a2b37;
  --anatomy-line: #654b5b;
  --anatomy-axis: #775666;
  --shadow: 0 10px 28px rgb(0 0 0 / 25%);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button, input, textarea { font: inherit; }
button { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.screen {
  position: fixed;
  inset: 0 0 calc(var(--safe-b) + var(--dock-h));
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
}

.top {
  display: flex;
  align-items: center;
  gap: clamp(6px, 1vw, 14px);
  min-width: 0;
  padding: calc(var(--safe-t) + 10px) max(var(--pad), var(--safe-r)) 10px max(var(--pad), var(--safe-l));
  background: var(--card);
  border-bottom: 1px solid var(--line);
}
.ward-link {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  min-height: 36px;
  padding: 4px 10px;
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid transparent;
  border-radius: 9px;
  font-weight: 650;
  white-space: nowrap;
  cursor: pointer;
}
.ward-link svg, .icobtn svg {
  width: 20px;
  height: 20px;
  flex: none;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.65;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.patient { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px; min-width: 0; }
.patient-identity { display: grid; gap: 1px; min-width: 0; }
.admission-link {
  min-height: 36px;
  padding: 4px 7px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 12px;
  font-weight: 650;
  white-space: nowrap;
  cursor: pointer;
}
.top .who, .top .meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0; }
.top .who { font-size: clamp(16px, 2vw, 23px); line-height: 1.2; }
.top .meta { font-size: 12px; color: var(--ink-2); }
.top .sp { flex: 1; }

.pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
  color: var(--ink);
  padding: 4px 8px;
  font-size: 12px;
  white-space: nowrap;
}
.pill.num { font-family: var(--mono); }
#levelPill, #btnAsk { min-height: 33px; cursor: pointer; }
#levelPill { color: var(--ink-2) !important; }
#btnAsk { margin-left: 0 !important; }
#clock {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--card);
  padding: 5px 9px;
  font-size: 16px;
  font-weight: 700;
}
#budgetChip {
  flex: 0 1 auto;
  min-width: 0;
  max-width: 34vw;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: clamp(10px, 1.4vmin, 12px);
}
.seg {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border-radius: 9px;
  background: var(--subtle);
  border: 1px solid var(--line);
}
.seg .pill { min-height: 28px; padding: 2px 7px; background: transparent; border-color: transparent; cursor: pointer; }
.seg .pill.on { background: var(--card); border-color: var(--line); color: var(--accent); font-weight: 700; }
.seg .pill.ff.on { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }

.stage {
  display: grid;
  grid-template-columns: minmax(235px, 1fr) minmax(230px, 1.5fr) minmax(225px, 1fr);
  align-items: stretch;
  gap: clamp(10px, 1.5vw, 22px);
  width: min(100%, var(--work-width));
  min-height: 0;
  margin-inline: auto;
  padding: clamp(12px, 2.1vh, 22px) max(var(--pad), var(--safe-r)) clamp(12px, 2.1vh, 22px) max(var(--pad), var(--safe-l));
}
.rail {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
  min-height: 0;
  overflow: auto;
  padding: 2px;
}
.panel {
  min-width: 0;
  padding: clamp(10px, 1.25vw, 18px);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 15px;
}
.panel-title { margin: 0 0 10px; color: var(--ink-2); font-size: 14px; font-weight: 700; }
#vitals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.vpill {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, auto) minmax(0, 1fr);
  justify-content: start;
  align-items: baseline;
  gap: 4px;
  min-width: 0;
  min-height: 62px;
  padding: 7px 8px;
  text-align: left;
  background: var(--subtle);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--ink);
  cursor: pointer;
}
.vpill .k { grid-column: 1 / -1; padding-right: 9px; color: var(--ink-2); font-size: 12px; line-height: 1.1; }
.vpill .v { font: 700 clamp(17px, 1.7vw, 24px)/1.1 var(--mono); letter-spacing: -.055em; white-space: nowrap; }
.vpill .u { font-size: 9px; color: var(--ink-2); white-space: nowrap; }
.vpill .u:empty { display: none; }
.vpill .dot { position: absolute; top: 9px; right: 8px; width: 6px; height: 6px; background: var(--green); border-radius: 50%; }
.vpill.bad { color: var(--red); background: var(--danger-bg); }
.vpill.warn { color: var(--amber); background: var(--amber-bg); }
.vpill.bad .dot { background: var(--red); }
.vpill.warn .dot { background: var(--amber); }
#states { display: flex; flex-wrap: wrap; gap: 6px; }
.spill {
  min-height: 32px;
  min-width: 0;
  display: inline-flex;
  align-items: center;
  padding: 4px 8px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: var(--danger-bg);
  color: var(--red);
  font-size: 12px;
  font-weight: 650;
  text-align: left;
  overflow-wrap: anywhere;
  cursor: pointer;
}
.spill.ok { color: var(--green); background: var(--green-bg); }

.bodywrap {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  padding: clamp(10px, 1.4vw, 18px);
  background: linear-gradient(160deg, var(--card), var(--anatomy-bg));
}
.anatomy-view { position: relative; min-height: 0; }
.anat { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.atlas-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; }
.atlas-heading small { color: var(--ink-2); font-size: 11px; }
.organ-picker { width: 100%; min-height: 44px; margin-bottom: 6px; padding: 6px 10px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--subtle); color: var(--ink); font-family: inherit; font-size: 14px; font-weight: 650; cursor: pointer; }
.organ-picker:focus-visible { outline: 2px solid var(--accent); }
.organ-picker[data-state="crit"] { background: var(--danger-bg); color: var(--red); }
.organ-picker[data-state="warn"] { background: var(--amber-bg); color: var(--amber); }

.opan { display: grid; gap: 6px; }
.opan.hide { display: none; }
.opan .organ-action { justify-self: start; color: var(--accent); cursor: pointer; }
.flow-settings { padding: 12px; display: grid; gap: 8px; }
.flow-settings label { display: flex; align-items: baseline; gap: 5px; }
.flow-settings output { margin-left: auto; font: 700 24px var(--mono); }
.flow-settings input { width: 100%; margin: 0; accent-color: var(--accent); }
.flow-scale { display: flex; justify-content: space-between; color: var(--ink-2); font-family: var(--mono); }
.flow-settings p { margin: 2px 0; color: var(--ink-2); }
.flow-settings button { justify-self: end; cursor: pointer; }
#vascularTone { padding: 4px 0; color: var(--ink-2); font-size: 12px; }
#conditionReviewResult { margin: 0 0 8px; color: var(--ink-2); font-size: 12px; }
.opan .row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: baseline;
  gap: 4px;
  padding: 5px 0;
  border-bottom: 1px solid var(--line);
}
.opan .lab { color: var(--ink-2); font-size: 12px; }
.opan .val { text-align: right; font: 650 13px/1.3 var(--mono); overflow-wrap: anywhere; }
.opan .val span { color: var(--ink-3) !important; }
.opan canvas { display: block; width: 100%; height: 49px; border-radius: 8px; background: var(--subtle); }
#mentorWrap {
  left: max(var(--pad), var(--safe-l)) !important;
  bottom: calc(var(--safe-b) + var(--dock-h) + 10px) !important;
  width: min(30vw, 300px);
}
#mentorSlot #mentorWrap { position: static !important; width: auto; max-width: none !important; }
#mentorSlot:not(:has(#mentorCard:not([style*="display: none"], [style*="display:none"]))) { display: none; }
#mentorSlot:not(:empty) #mentorCard { padding: 9px 11px !important; box-shadow: none !important; }
#mentorCard { max-height: 110px; overflow: auto; }
#bedBar { bottom: calc(var(--safe-b) + var(--dock-h) + 6px) !important; color: var(--ink) !important; background: var(--card) !important; }

.dock {
  position: fixed;
  inset: auto 0 0;
  z-index: 20;
  display: flex;
  justify-content: center;
  align-items: stretch;
  gap: clamp(4px, 1.4vw, 14px);
  min-height: calc(var(--safe-b) + var(--dock-h));
  padding: 8px max(var(--pad), var(--safe-r)) calc(var(--safe-b) + 8px) max(var(--pad), var(--safe-l));
  background: var(--card);
  border-top: 1px solid var(--line);
}
.icobtn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  width: min(16%, 138px);
  min-width: 0;
  min-height: 44px;
  padding: 5px 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: var(--ink);
  font-weight: 650;
  cursor: pointer;
}
.icobtn.reports { color: var(--accent); }
#btnDrug { background: var(--accent); border-color: var(--accent); color: var(--accent-on); }

.mask {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgb(35 20 29 / 49%);
  opacity: 0;
  visibility: hidden;
  transition: opacity .18s;
}
.mask.on { opacity: 1; visibility: visible; }
.sheet {
  position: fixed;
  inset: auto 0 0;
  z-index: 31;
  display: flex;
  flex-direction: column;
  max-height: min(88dvh, calc(100dvh - var(--safe-t) - 4px));
  padding: 0 max(0px, var(--safe-r)) var(--safe-b) max(0px, var(--safe-l));
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 18px 18px 0 0;
  background: var(--card);
  box-shadow: var(--shadow);
  visibility: hidden;
  transform: translateY(102%);
  transition: transform .23s ease, visibility .23s;
}
.sheet.on { transform: translateY(0); visibility: visible; }
.sheet-header {
  display: flex;
  flex: none;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 7px 10px 7px 16px;
  border-bottom: 1px solid var(--line);
}
.sheet h3 { min-width: 0; margin: 0; font-size: 17px; }
.sheet h3 small { margin-left: 4px; color: var(--ink-2); font-size: 12px; font-weight: 500; }
.sheet .list { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 6px 10px 10px; }
.sheet input, .sheet canvas, .sheet img, .sheet video { max-width: 100%; }
.sheet input { display: block; width: 100%; }
#drugSearch { min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--subtle); color: var(--ink); font: inherit; }
#drugTabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; }
#drugTabs button, #drugBack { flex: none; min-height: 36px; padding: 6px 12px; color: var(--ink-2); cursor: pointer; }
#drugTabs [aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
#drugList details { border-bottom: 1px solid var(--line); }
#drugList summary { min-height: 44px; padding: 12px 8px; color: var(--ink); font-weight: 650; cursor: pointer; }
#drugList summary::marker { color: var(--ink-2); }
#drugList summary small { float: right; color: var(--ink-2); font-weight: 400; }
#drugList .nm small { color: var(--ink-2); font-size: 11px; }
#drugBack { margin-bottom: 8px; }
.sound-settings { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 16px; padding: 10px; }
.sound-settings label { font-weight: 650; }
.sound-settings output { font-variant-numeric: tabular-nums; color: var(--ink-2); text-align: right; }
.sound-settings input { min-height: 44px; min-width: 0; margin: 0; accent-color: var(--accent); cursor: pointer; }
.sound-settings button { min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; }
.sound-settings button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.sheet canvas { display: block; width: 100% !important; height: auto; margin: 8px 0; border-radius: 10px; background: var(--subtle); }
.drow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  min-height: 44px;
  padding: 9px;
  border-radius: 8px;
  cursor: pointer;
}
button.drow { width: 100%; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; }
.paired-actions { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px; }
.related-action { min-height: 44px; border: 0; background: transparent; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; }
.drow .nm { flex: 1 1 115px; min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
.drow .tag { padding: 2px 6px; border-radius: 5px; color: var(--ink-2); background: var(--subtle); font-size: 11px; }
.drow .amt { color: var(--ink-2); font-family: var(--mono); font-size: 11px; text-align: right; }
.drow .tag:empty, .drow .amt:empty { display: none; }
.drow[data-rule] { display: grid; grid-template-columns: 1fr auto; gap: 5px 12px; }
.drow[data-rule] .tag { grid-row: 2; grid-column: 1 / -1; background: none; padding: 0; line-height: 1.5; }
.drow[data-rule] .amt { grid-column: 2; grid-row: 1; }
.drow[data-rule][aria-pressed="true"] .amt { color: var(--accent); font-weight: 700; }
.sec { padding: 12px 9px 3px; color: var(--ink-2); font-size: 12px; font-weight: 680; }

.detail {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: none;
  align-items: center;
  justify-content: center;
  padding: max(12px, var(--safe-t)) max(12px, var(--safe-r)) max(12px, var(--safe-b)) max(12px, var(--safe-l));
  background: rgb(35 20 29 / 49%);
}
.detail.on { display: flex; }
.detail .card {
  position: relative;
  width: min(450px, 100%);
  max-height: 100%;
  padding: 18px;
  overflow: auto;
  overscroll-behavior: contain;
  border-radius: 15px;
  background: var(--card);
  box-shadow: var(--shadow);
}
.detail h4 { margin: 0 40px 3px 0; font-size: 18px; }
.detail .sub { margin-bottom: 12px; color: var(--ink-2); font-size: 12px; }
.detail dl { display: grid; grid-template-columns: minmax(60px, auto) minmax(0, 1fr); gap: 8px 12px; margin: 0 0 12px; }
.detail dt { color: var(--ink-2); font-size: 12px; }
.detail dd { margin: 0; overflow-wrap: anywhere; }
.detail .warn { padding: 9px 11px; border-radius: 8px; background: var(--danger-bg); color: var(--red); white-space: pre-wrap; }
.detail .warn.eligible { background: var(--subtle); color: var(--green); }
.detail .x { position: absolute; top: 6px; right: 6px; }
#detail[data-view="operation-log"] .card, #detail[data-view="infusions"] .card { width: min(560px, 100%); }
#detail[data-view="operation-log"] #dKv {
  max-height: 58vh; overflow-y: auto; overscroll-behavior: contain; overflow-anchor: none;
  grid-template-columns: max-content minmax(0, 1fr); gap: 0 12px; line-height: 1.5;
}
#detail[data-view="operation-log"] #dKv > * { padding: 7px 0; border-bottom: 1px solid var(--line); }
#detail[data-view="operation-log"] dt { font-family: var(--mono); font-variant-numeric: tabular-nums; }
#detail[data-view="infusions"] #dKv { display: block; }
.infusion-section + .infusion-section { margin-top: 16px; }
.infusion-section > dt { font-weight: 700; }
.infusion-row { padding: 10px 0; border-bottom: 1px solid var(--line); }
.infusion-row-heading, .infusion-amounts { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 10px; }
.infusion-status, .infusion-meta, .infusion-amounts { color: var(--ink-2); font-size: 12px; line-height: 1.65; }
.infusion-progress { display: block; width: 100%; height: 8px; margin: 8px 0 4px; accent-color: var(--accent); }
.infusion-manage { min-height: 40px; margin-top: 6px; cursor: pointer; }

#detail.case-review .card {
  width: min(760px, 100%);
  padding: clamp(12px, 3vw, 22px);
}
#detail.case-review #dName {
  font-size: clamp(20px, 4vw, 26px);
  line-height: 1.25;
}
#detail.case-review-success #dName { color: var(--green); }
#detail.case-review-failure #dName { color: var(--red); }
#detail.case-review #dSub {
  margin: 4px 44px 12px 0;
  overflow-wrap: anywhere;
}
#detail.case-review #dKv,
#detail.case-review #dWarn { display: none; }
#detail.case-review .case-review-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 10px;
}
#detail.case-review .case-review-section {
  min-width: 0;
  padding: clamp(10px, 2vw, 15px);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow-wrap: anywhere;
}
#detail.case-review .case-review-section h5 {
  margin: 0 0 8px;
  font-size: 15px;
  line-height: 1.3;
}
#detail.case-review .case-review-summary dl {
  grid-template-columns: minmax(4em, auto) minmax(0, 1fr);
  gap: 7px 10px;
  margin: 0;
}
#detail.case-review .case-review-summary dt { font-size: inherit; }
#detail.case-review .case-review-score table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
#detail.case-review .case-review-score :is(th, td) {
  padding: 5px 4px;
  border-bottom: 1px solid var(--line);
  text-align: start;
  vertical-align: top;
}
#detail.case-review .case-review-score :is(thead, tfoot) { background: var(--subtle); }
#detail.case-review .case-review-score tbody th { font-weight: 500; }
#detail.case-review .case-review-log-panel { grid-column: 1 / -1; }
#detail.case-review .case-review-log {
  min-height: 3.5rem;
  max-height: clamp(7rem, 27vh, 15rem);
  padding: 7px 9px;
  overflow-y: auto;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--subtle);
  font-size: 13px;

<style id="lobbyStyle">
#lobby {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  flex-direction: column;
  overflow: auto;
  overscroll-behavior: contain;
  padding: calc(var(--safe-t) + clamp(16px, 5vh, 62px)) max(var(--pad), var(--safe-r)) calc(var(--safe-b) + 16px) max(var(--pad), var(--safe-l));
  background: linear-gradient(150deg, var(--card), var(--bg) 60%);
}
#lobby .box {
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(240px, 1fr);

  gap: clamp(12px, 2.2vw, 26px);

.lobby-head { grid-area: heading; padding-bottom: 12px; border-bottom: 1px solid var(--line); }

#lobby .sub { margin: 7px 0 0; color: var(--ink-2); font-size: 14px; }
.lobby-beds { grid-area: beds; min-width: 0; }
.lobby-tools { grid-area: tools; display: grid; gap: 9px; min-width: 0; }
#lobby .cap { margin: 0 0 8px; color: var(--ink-2); font-size: 14px; font-weight: 700; }
.bed-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
#lobby .bed {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-content: start;
  align-items: center;
  gap: 7px 11px;
  min-width: 0;
  min-height: 104px;
  padding: 11px;
  border: 1px solid var(--line);

}

#lobby .nm { display: block; min-width: 0; font-size: 15px; font-weight: 680; overflow-wrap: anywhere; }
#lobby .meta { display: block; margin-top: 2px; color: var(--ink-2); font-size: 11.5px; font-weight: 450; }
#lobby .go { grid-column: 2; justify-self: start; color: var(--accent); font-size: 12px; font-weight: 670; }
.lobby-modes, #lobby .links { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.lobby-modes { grid-template-columns: repeat(3, minmax(0, 1fr)); }
#lobby .links button, .lobby-modes button {
  min-width: 0;
  min-height: 44px;
  padding: 5px 7px;

  font-size: 12px;

}

.lobby-release {

#lobby .foot { grid-area: foot; color: var(--ink-3); font-size: 12px; }

@media (hover: hover) {

  #lobby .bed-list { grid-template-columns: minmax(0, 1fr); }
}
</style>

        <h1 class="who" id="pname">—</h1>
        <p class="meta" id="pmeta">—</p>
      </div>
      <button class="admission-link" id="btnAdmission" type="button" aria-haspopup="dialog" hidden>病例说明</button>
    </div>
    <span class="sp"></span>
    <span class="pill num" id="clock" role="timer" aria-label="病例用时">02:14</span>

      <button class="pill" type="button" data-s="16" aria-pressed="false">16×</button>
      <button class="pill ff" id="ff" type="button" aria-pressed="false">快进 20×</button>
      <button class="pill" id="conditionWait" type="button" aria-pressed="false" title="推进全病房，直到出现明显变化、检查回报或达到 6 个模拟小时">等病情变化</button>
    </div>

  <main class="stage" aria-label="病房工作台">
    <div class="rail">
      <section class="panel monitor-panel" aria-labelledby="monitorTitle">

    <div class="rail">
      <section class="panel status-panel" aria-labelledby="statusTitle">
        <h2 class="panel-title" id="statusTitle">临床状态</h2>
        <div id="states"></div>
      </section>
      <section class="panel organ-panel" aria-labelledby="organTitle">
        <h2 class="panel-title" id="organTitle">器官参数</h2>
        <select class="organ-picker" id="opTitle" aria-label="选择器官"></select>
